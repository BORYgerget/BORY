<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Write Something Before Viewing the PDF</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 100px; }
    input[type="text"] { width: 60%; padding: 10px; font-size: 16px; }
    button { padding: 10px 30px; font-size: 16px; margin-top: 10px; }
  </style>
</head>
<body>
  <h2>Add Your Message Before Viewing the PDF TEST</h2>
  <form id="beforePdfForm">
    <input type="text" id="userText" placeholder="something..." required>
    <br>
    <button type="submit">Continue to PDF</button>
  </form>

  <script>
    document.getElementById('beforePdfForm').addEventListener('submit', function(e) {
      e.preventDefault();
      window.location.href = 'document.pdf';
    });
  </script>
</body>
</html>
